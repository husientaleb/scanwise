<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="theme-color" content="#f6faf7" />
  <meta name="description" content="Ingrado — Scan a food label and get a clear, balanced explanation of the ingredients and nutrition. Scan it. Understand it. Choose better." />
  <title>Ingrado — Scan it. Understand it. Choose better.</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-shell">
    <main id="app" tabindex="-1" aria-live="polite"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation">
      <a href="#/home" data-nav="home" class="nav-item" aria-label="Home">

        <span>Home</span>
      </a>

        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

      </a>

        <span class="nav-scan-circle">

        <span>Favorites</span>
